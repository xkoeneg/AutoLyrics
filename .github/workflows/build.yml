name: Build AutoLyrics

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the build to a GitHub Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Syntax check
        run: python -m py_compile app.py

      # onedir (not onefile): the AI libraries make the app large, and onefile would
      # unpack hundreds of MB on every launch (slow start / "decompression" errors).
      - name: Build application
        run: >-
          pyinstaller --noconfirm --clean --onedir --windowed
          --name AutoLyrics
          --icon assets/icon.ico
          --collect-all winsdk
          --collect-all yt_dlp
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all onnxruntime
          --collect-all av
          --hidden-import pystray._win32
          app.py

      - name: Zip build
        run: Compress-Archive -Path dist/AutoLyrics -DestinationPath dist/AutoLyrics-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoLyrics-windows
          path: dist/AutoLyrics-windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoLyrics-windows.zip
          generate_release_notes: true
